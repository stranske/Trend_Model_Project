<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Simulator — browser demo (stlite/Pyodide)</title>
    <!--
      Browser demo for stranske/Trend_Model_Project issue #5343.

      This page runs the *real* Streamlit app (streamlit_app/app.py) entirely in
      the browser via stlite + Pyodide — no server, no Streamlit Community Cloud.
      It is built to satisfy the owner decision recorded in issue #5343: a
      WASM/Pyodide/stlite demo, not a Streamlit Cloud deployment.

      Two runtime profiles, resolved from the `?profile=` query parameter and
      passed to the app via the same parameter (see streamlit_app/demo_profile.py):

        ?profile=presentation_safe  (default) — synthetic data only; LLM,
            custom-analysis, and upload surfaces are hidden. Lean requirement
            set with no LangChain, so a presentation/locked-down PC load makes
            no LLM dependency or network calls.
        ?profile=public_llm_demo — adds the LangChain stack and exposes the
            LLM UI. Provider keys/endpoints must be supplied at runtime; none
            are bundled here.

      The file list and per-profile requirements come from manifest.json, which
      is generated by `python scripts/build_wasm_demo.py`. The deploy step must
      publish this repository's `streamlit_app/`, `src/trend_analysis/`, and
      `demo/` subset next to this page (default base `./app/`, override with
      `?base=`). See README.md in this directory for the full deploy and
      verification checklist.
    -->
    <link rel="stylesheet" href="./vendor/stlite@0.79.4/style.css" />
    <style>
      html, body, #root { margin: 0; height: 100%; }
      #boot { font-family: system-ui, sans-serif; padding: 1.5rem; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Loading browser demo… (first load compiles Python in your browser and can take a minute)</div></div>
    <script type="module">
      import { mount } from "./vendor/stlite@0.79.4/stlite.js";

      const params = new URLSearchParams(window.location.search);
      const VALID_PROFILES = ["presentation_safe", "public_llm_demo"];
      const requested = (params.get("profile") || "").trim().toLowerCase();
      const profile = VALID_PROFILES.includes(requested) ? requested : "presentation_safe";
      // Base directory the app source subset is published under at deploy time.
      const base = (params.get("base") || "./app/").replace(/\/?$/, "/");

      async function loadManifest() {
        const res = await fetch("./manifest.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`manifest.json fetch failed: ${res.status}`);
        return res.json();
      }

      async function loadFiles(paths) {
        const entries = await Promise.all(
          paths.map(async (path) => {
            const res = await fetch(base + path, { cache: "no-cache" });
            if (!res.ok) throw new Error(`failed to load ${path}: ${res.status}`);
            return [path, await res.text()];
          })
        );
        return Object.fromEntries(entries);
      }

      function fail(message) {
        document.getElementById("root").innerHTML =
          `<div id="boot"><strong>Demo failed to load.</strong><br/>${message}</div>`;
      }

      (async () => {
        try {
          const manifest = await loadManifest();
          const rawRequirements =
            manifest.requirements[profile] || manifest.requirements.presentation_safe;
          // Requirements that are bare PyPI names (numpy, pandas, …) resolve
          // against the vendored Pyodide lock and pass through untouched.
          // Requirements ending in ``.whl`` are wheels vendored OUTSIDE the lock
          // (plotly, under ./vendor/pypi/) and listed in the manifest as
          // repo-relative paths. The stlite web worker's micropip treats a
          // bare-relative wheel URL as ``file://`` and refuses it, so each must
          // be resolved to an ABSOLUTE same-origin URL here — exactly as the
          // pyodideUrl below is. (Same gotcha, same fix.)
          const requirements = rawRequirements.map((req) =>
            req.endsWith(".whl")
              ? new URL(req, window.location.href).href
              : req
          );
          const files = await loadFiles(manifest.files);
          mount(
            {
              entrypoint: manifest.entrypoint,
              pyodideUrl: new URL(
                "./vendor/pyodide-0.27.2/pyodide.mjs",
                window.location.href
              ).href,
              // Pass the resolved profile through to the app. demo_profile.py
              // reads ?profile= from st.query_params on first render.
              args: ["--", `profile=${profile}`],
              requirements,
              files,
            },
            document.getElementById("root")
          );
        } catch (err) {
          fail(err && err.message ? err.message : String(err));
        }
      })();
    </script>
  </body>
</html>
