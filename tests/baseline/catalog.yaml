# Scenario catalog -- the confirmed Tier 0/1/2 plan for TMP.
#
# This file is the human-editable source of truth for *what we test*.
# Adding a scenario = adding an entry here; no harness code changes needed.
#
#   baseline   Tier 0: the reference run, captured as a full golden master.
#   scenarios  Tier 1: directional ("metamorphic") checks. Each runs a `control`
#              and a `vary` config off the same `base`, then checks that a named
#              metric moves in the expected `direction`.
#                enforce: true   -> a wrong direction FAILS the suite (high confidence)
#                enforce: false  -> direction is recorded/reported, not asserted
#                                   (we are still confirming what "sensible" is)
#   toggles    Tier 2: wiring checks. Flipping a UI-exposed flag must CHANGE output;
#              if it doesn't, the control is not wired to the logic.

baseline:
  config: config/demo.yml

# Metric names understood by the harness (see harness.ScenarioOutput.derived):
#   ann_return, ann_vol, sharpe, max_drawdown,
#   weight_sum, max_weight, min_weight, num_selected,
#   num_negative_weights, max_turnover

scenarios:
  - id: vol_target_up
    tier: 1
    param: vol_adjust.target_vol
    description: Raising the volatility target should raise realized portfolio vol.
    base: {vol_adjust.enabled: true}
    control: {vol_adjust.target_vol: 0.10}
    vary: {vol_adjust.target_vol: 0.20}
    metric: ann_vol
    direction: increase
    enforce: false   # interaction with floor_vol/leverage is model-specific

  - id: max_weight_down
    tier: 1
    param: portfolio.constraints.max_weight
    description: Lowering the max-weight cap should lower the largest held weight.
    base: {}
    control: {portfolio.constraints.max_weight: 0.25}
    vary: {portfolio.constraints.max_weight: 0.05}   # 0.05 binds on the demo (0.10 did not)
    metric: max_weight
    direction: decrease
    enforce: true

  - id: rank_n_down
    tier: 1
    param: portfolio.rank.n
    # FINDING (2026-05-30): in the demo's multi-period path, holdings stay at 20
    # regardless of rank.n, multi_period.max_funds, or min_funds. Left report-only
    # until we confirm whether the fund-count knobs are wired into multi-period.
    description: Selecting fewer funds should reduce the number of holdings (currently does not in multi-period).
    base: {}
    control: {portfolio.rank.n: 10}
    vary: {portfolio.rank.n: 5}
    metric: num_selected
    direction: decrease
    enforce: false

  - id: cost_up
    tier: 1
    param: portfolio.transaction_cost_bps
    description: Higher transaction costs should not increase net annual return.
    base: {}
    control: {portfolio.transaction_cost_bps: 0}
    vary: {portfolio.transaction_cost_bps: 50}
    metric: ann_return
    direction: decrease_or_equal
    enforce: true

  - id: rf_up
    tier: 1
    param: metrics.rf_rate_annual
    description: A higher risk-free rate should lower the reported Sharpe ratio.
    base: {metrics.rf_override_enabled: true}
    control: {metrics.rf_rate_annual: 0.02}
    vary: {metrics.rf_rate_annual: 0.05}
    metric: reported_sharpe
    direction: decrease
    enforce: true   # fixed 2026-05-30: rf override now flows into per-fund Sharpe

  - id: long_only_off
    tier: 1
    param: portfolio.constraints.long_only
    description: Disabling long-only may permit negative (short) weights.
    base: {}
    control: {portfolio.constraints.long_only: true}
    vary: {portfolio.constraints.long_only: false}
    metric: num_negative_weights
    direction: increase_or_equal
    enforce: false

  - id: weighting_risk_parity
    tier: 1
    param: portfolio.weighting_scheme
    description: Risk-parity weighting should produce a different allocation than equal.
    base: {}
    control: {portfolio.weighting_scheme: equal}
    vary: {portfolio.weighting_scheme: risk_parity}
    metric: max_weight
    direction: change   # only require the allocation to differ
    enforce: false

  - id: turnover_cap_down
    tier: 1
    param: portfolio.max_turnover
    description: A tighter turnover cap should reduce realized turnover.
    base: {}
    control: {portfolio.max_turnover: 1.0}
    vary: {portfolio.max_turnover: 0.10}
    metric: max_turnover
    direction: decrease_or_equal
    enforce: false

toggles:
  - id: vol_adjust_toggle
    flag: vol_adjust.enabled
    description: Toggling volatility targeting must change output.
    enforce: true
  - id: regime_toggle
    flag: regime.enabled
    # FINDING RESOLVED (2026-06-11): multi-period regime settings are wired only
    # into regime-conditional portfolio.max_turnover mappings. The demo uses a
    # scalar max_turnover, so toggling regime.enabled leaves output identical by
    # design; see README.md "Multi-period regime scope" and docs/UserGuide.md.
    description: Toggling regime detection is a no-op for scalar max_turnover in the multi-period demo.
    enforce: false
  - id: shrinkage_toggle
    flag: portfolio.robustness.shrinkage.enabled
    description: Toggling covariance shrinkage must change output.
    enforce: false   # may be a no-op on the small, well-conditioned demo set

# Priority parameters (the confirmed top-impact set). The coverage manifest
# asserts each is exercised by at least one scenario or toggle above.
priority_params:
  - vol_adjust.target_vol
  - vol_adjust.enabled
  - portfolio.constraints.max_weight
  - portfolio.rank.n
  - portfolio.transaction_cost_bps
  - portfolio.max_turnover
  - portfolio.weighting_scheme
  - portfolio.robustness.shrinkage.enabled
  - regime.enabled
  - metrics.rf_rate_annual
  - portfolio.constraints.long_only
