[build-system]
# Pin build dependencies to ensure reproducible installs during Docker builds
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

# Do not emit app-baseline-kit into requirements.lock. It is consumed from the
# Workflows monorepo via an unpinned `@main` git URL (see the dev optional
# dependencies), so freezing a commit SHA in the lock conflicts with that URL
# the moment Workflows main advances ("conflicting URLs for package
# app-baseline-kit" -> uv install aborts). Leaving it unpinned lets the editable
# project install resolve it from main, with no lock to keep refreshed.
[tool.uv.pip]
no-emit-package = ["app-baseline-kit"]

[project]
name = "trend-model"
version = "0.1.0"
description = "Volatility-adjusted trend analysis package"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Trend Analysis Contributors"}
]
maintainers = [
    {name = "Trend Analysis Contributors"}
]
keywords = ["finance", "trend-analysis", "volatility", "portfolio", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyYAML==6.0.3",
    "fpdf2==2.8.7",
    "hypothesis==6.155.7",
    "ipywidgets==8.1.8",
    "joblib==1.5.3",
    "jsonschema>=4.26.0,<4.27.0",
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "pandera==0.32.0",
    "plotly==6.8.0",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "scipy==1.18.0",
    "xlsxwriter==3.2.9",
]

[project.urls]
Homepage = "https://github.com/stranske/Trend_Model_Project"
Repository = "https://github.com/stranske/Trend_Model_Project"
Issues = "https://github.com/stranske/Trend_Model_Project/issues"
Documentation = "https://github.com/stranske/Trend_Model_Project#readme"

[project.scripts]
trend = "trend.cli:main"
trend-llm-proxy = "trend_analysis.llm_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "trend_analysis*",
    "trend*",
    "utils*",
    "analysis*",
    "data",
    "backtest*",
]
# Explicitly exclude retired and legacy modules regardless of their location.
# This guards against future refactors accidentally reintroducing the folders
# into the package search path when additional roots are added.
exclude = ["Old*", "retired*", "**/Old*", "**/retired*"]

[tool.setuptools.package-data]
trend_analysis = ["preset_data/*.yml", "preset_data/monte_carlo/*.yml"]

[project.optional-dependencies]
app = [
    "streamlit==1.58.0",
    "streamlit-sortables==0.3.1",
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "httpx==0.28.1",
]
llm = [
    "langchain>=1.3,<1.4",
    "langchain-core>=1.4,<1.5",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1.3,<2",
    "langchain-anthropic>=0.3,<1.6",
    "langchain-ollama>=1.1.0,<1.2",
    "langsmith==0.10.9",
]
notebooks = [
    "ipyfilechooser==0.6.0",
    "nbformat==5.10.4",
]
dev = [
    "pre-commit==4.6.0",
    "black==26.5.1",
    "ruff==0.16.3",
    "isort==8.0.1",
    "docformatter==1.7.8",
    "mypy==2.3.0",
    "flake8==7.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-regressions==2.11.0",
    # Shared app behavior baseline harness (also pulls pytest-regressions). Pinned to
    # the Workflows default branch; move to a tagged ref once the package is versioned.
    "app-baseline-kit @ git+https://github.com/stranske/Workflows.git#subdirectory=packages/app-baseline-kit",
    "coverage==7.15.4",
    "pytest-rerunfailures==16.3",
    "pytest-xdist==3.8.0",
    "packaging==26.2",
    "streamlit==1.58.0",
    "fastapi==0.138.1",
    "types-PyYAML==6.0.12.20260518",
    "types-requests==2.33.0.20260518",
    "httpx==0.28.1",
    "tomlkit==0.15.0",
]

[tool.black]
# Must equal the CI gate in ci.yml (black --check --line-length 100). Because the pre-commit
# hook and scripts/style_gate_local.sh both invoke black with no --line-length flag, they read
# this value - so setting it here is what keeps local formatting and CI in agreement.
line-length = 100
extend-exclude = '''
/(
        Old
    | notebooks/old
    | archives
    | archives/legacy_assets
    | \\.autofix-venv
    | .*\.ipynb
)/
'''
force-exclude = '''
/\.autofix-venv/
'''

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F"]
extend-exclude = [
    "archives",
    "archives/**",
    "archives/legacy_assets",
    "notebooks/old",
    "Old",
    "*.ipynb",
    "scripts",
    "manager_attribution_analysis.py",
    "examples/portfolio_analysis_report.py",
    "examples/debug_fund_selection.py",
    "test_multi_period_selection.py",
    ".autofix-venv",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]
exclude = "(/|^)(Old/|notebooks/|archives/|retired/|scripts/|tools/|examples/|analysis/|reports/|data/|demo/|perf/|issues/|docs/|streamlit_app/)"
mypy_path = ["src", "src/trend_analysis/stubs"]
explicit_package_bases = true
namespace_packages = true

[tool.coverage.report]
fail_under = 80

[[tool.mypy.overrides]]
module = "src.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "demo_malformed_date_fix",
    "demo_proxy",
    "examples.demo_robust_weighting",
    "examples.demo_turnover_cap",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "streamlit_app.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "trend_analysis.api_server.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "trend_analysis.llm_proxy.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "health_summarize.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "scripts.verify_codex_bootstrap",
    "scripts.run_multi_demo",
    "scripts.run_real_model",
    "scripts.run_threshold_churn_demo",
    "scripts.benchmark_performance",
    "examples.integration_example",
    "examples.debug_fund_selection",
    "test_multi_period_selection",
]
ignore_errors = true



[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that exercise external tooling",
]
