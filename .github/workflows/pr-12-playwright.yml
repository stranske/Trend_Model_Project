name: PR 12 - Fund selector Playwright smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    name: Fund selector E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install project with dev extras
        run: |
          pip install uv
          uv pip install --system '.[dev,app]'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run fund selector smoke
        env:
          PYTHONPATH: .
        run: |
          npm run test:e2e:fund-selector
