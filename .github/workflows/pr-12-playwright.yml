name: PR 12 - Fund selector Playwright smoke

on:
  push:
    branches:
      - phase-2-dev
      - main
  pull_request:
    branches:
      - phase-2-dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    name: Fund selector E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install project with dev extras
        run: |
          pip install uv
          uv pip install --system '.[dev,app]'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Playwright dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run fund selector smoke
        env:
          PYTHONPATH: .
        run: |
          npm run test:e2e:fund-selector
