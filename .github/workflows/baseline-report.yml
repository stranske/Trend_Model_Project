# Keeps docs/reports/baseline-coverage.md fresh for the weekly repo-review
# evaluator (which reads committed reports under docs/reports/). Runs the
# baseline suite (regenerating the report) and commits it if it changed.
#
# Scheduled weekly, ahead of the evaluator; also runnable on demand. It does NOT
# gate PRs.
#
# NOTE: baseline_kit lives in the (private) stranske/Workflows repo under
# packages/app-baseline-kit, so install needs a token with read access there.
# Uses AGENTS_AUTOMATION_PAT for the install and a bot PAT to push the report.
#
# Pilot: self-contained in this consumer. Once the kit is templatized it should
# become a reusable workflow in stranske/Workflows, synced to consumers.
name: baseline-report

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the weekly review
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: baseline-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.ACTIONS_BOT_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          git config --global url."https://x-access-token:${{ secrets.AGENTS_AUTOMATION_PAT }}@github.com/stranske/".insteadOf "https://github.com/stranske/"
          pip install -e ".[dev]"
          pip install "app-baseline-kit @ git+https://x-access-token:${{ secrets.AGENTS_AUTOMATION_PAT }}@github.com/stranske/Workflows.git#subdirectory=packages/app-baseline-kit"

      - name: Refresh coverage manifest report
        env:
          PYTHONHASHSEED: "0"
        # Non-aborting: a golden drift must not stop the regression report below.
        run: pytest tests/baseline/test_coverage_manifest.py -n0 -q || true

      - name: Emit baseline-regression report on golden drift
        env:
          PYTHONHASHSEED: "0"
        # Runs the golden suite; on drift writes docs/reports/baseline-regression.md
        # for the weekly repo-review evaluator to turn into an "investigate drift"
        # issue. Removes the report when goldens are clean. Always exits 0.
        run: python scripts/baseline_regression_report.py

      - name: Commit refreshed reports if changed
        run: |
          if ! git diff --quiet -- docs/reports/baseline-coverage.md docs/reports/baseline-regression.md \
             || [ -n "$(git status --porcelain docs/reports/baseline-regression.md)" ]; then
            git config user.name "stranske-bot"
            git config user.email "bot@stranskemo.com"
            git add -A docs/reports/baseline-coverage.md docs/reports/baseline-regression.md
            git commit -m "chore(baseline): refresh coverage + regression reports [skip ci]" || echo "nothing to commit"
            git push || echo "nothing to push"
          else
            echo "Baseline reports already current."
          fi
