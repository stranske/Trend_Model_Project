# -----------------------------------------------------------------------------
# Gate Workflow — Consumer Repository Template
# -----------------------------------------------------------------------------
# Orchestrates CI enforcement for pull requests. The `summary` job aggregates
# results and publishes the commit status that keepalive automation relies on.
#
# USAGE:
#   - Standard Python projects: Use this template as-is
#   - Custom projects: Use as a STARTING POINT, customize the test job(s)
#
# IMPORTANT: The `summary` job and `Gate / gate` commit status are REQUIRED
# for keepalive automation to detect CI results. Do not remove or rename them.
#
# SYNC BEHAVIOR:
#   - This file is NOT auto-synced to repos with custom Gate workflows
#   - Repos in CUSTOM_GATE_REPOS list in maint-68-sync-consumer-repos.yml
#     maintain their own Gate and should update manually if needed
#
# Copy this file to: .github/workflows/pr-00-gate.yml
#
# Required secrets: None (uses GITHUB_TOKEN)
# Optional secrets: Passed via `secrets: inherit` to reusable workflow
#
# Examples of custom Gates based on this template:
#   - stranske/trip-planner (Flask + requirements.txt)
#   - stranske/Manager-Database (FastAPI + docker-compose)
# -----------------------------------------------------------------------------

name: Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref_name }}-gate
  cancel-in-progress: true

jobs:
  detect:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      is_python_code: ${{ steps.classify.outputs.is-python-code || 'true' }}
      is_workflow_change: ${{ steps.classify.outputs.is-workflow-change || 'false' }}
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      classification_rationale: ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify:full') || github.event_name == 'schedule' }}

  python-ci:
    name: Python CI
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    uses: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main
    with:
      python-versions: '["3.12", "3.13"]'
      coverage-min: "80"
      # Must stay true: ci.yml enforces `black --check --line-length 100` on push to phase-3,
      # so a PR gate that skips the format check lets unformatted code merge green and redden
      # the default branch on the very next push. The old comment here ("Using ruff for
      # formatting") was inaccurate - this repo does not run `ruff format`, and its ruff config
      # is lint.select = ["E4","E7","E9","F"], which performs no formatting at all.
      format_check: true
      working-directory: "."
      artifact-prefix: "gate-"
      # Keep PR Gate fast: the MC-viz CLI integration suite runs in a dedicated
      # workflow triggered by relevant file changes.
      pytest_markers: "not mc_viz_integration"
      # Enable soft coverage gate for trend tracking and hotspot reporting
      enable-soft-gate: true
    secrets: inherit

  llm-deps:
    name: LLM Dependency Compatibility
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies (LLM + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Validate LLM dependency compatibility
        run: |
          python scripts/validate_llm_deps.py
          pytest -q tests/test_llm_dependency_compatibility.py

  legacy-surface:
    name: Legacy Surface Contract
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_python_code == 'true' ||
        needs.detect.outputs.is_docs_only == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Verify final supported surface
        run: |
          pytest -q \
            tests/test_legacy_surface_absence.py \
            tests/test_wheel_surface.py \
            tests/test_cli_installed.py \
            tests/test_streamlit_smoke_ci.py \
            tests/test_export_outputs.py

  config-coverage:
    name: Config Coverage Check
    needs: detect
    if: ${{ needs.detect.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run config coverage check
        run: |
          # "Ignored keys" here counts config keys READ during the demo run
          # (validated-key tracking is not yet wired, so ignored == read count).
          # Raised 72 -> 81: the config-loader fix (PortfolioSettings extra="allow")
          # makes the demo honor selection_mode/rank/selector/custom_weights/weighting,
          # and fleet-record fingerprinting now reads run metadata from the same config path.
          # Lowered 81 -> 76: A2 (#5400) deleted the ~19 documented-but-unconsumed keys,
          # reducing the ignored count from ~81 to 76.
          # Raised 76 -> 83: #5821 shared trend_spec_from_mapping reads legacy
          # signals.trend_* alias keys during the demo coverage run.
          # Raised 83 -> 85: #5813 api.run_simulation now resolves portfolio costs and
          # weighting through the shared config_contract helpers during demo runs.
          # Raised 85 -> 88: the canonical nested config migration reads three
          # additional paths during the same demo coverage gate.
          python scripts/check_config_coverage.py \
            --config config/demo.yml \
            --ignored-threshold 88

  summary:
    name: gate-summary
    needs: [detect, python-ci, llm-deps, legacy-surface, config-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      state: ${{ steps.summarize.outputs.state }}
      description: ${{ steps.summarize.outputs.description }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Summarize results
        id: summarize
        env:
          DETECT_RESULT: ${{ needs.detect.result || 'skipped' }}
          PYTHON_RESULT: ${{ needs.python-ci.result || 'skipped' }}
          LLM_DEPS_RESULT: ${{ needs.llm-deps.result || 'skipped' }}
          LEGACY_SURFACE_RESULT: ${{ needs.legacy-surface.result || 'skipped' }}
          CONFIG_COV_RESULT: ${{ needs.config-coverage.result || 'skipped' }}
        run: |
          set -euo pipefail

          python_result="${PYTHON_RESULT:-skipped}"
          llm_deps_result="${LLM_DEPS_RESULT:-skipped}"
          legacy_surface_result="${LEGACY_SURFACE_RESULT:-skipped}"
          config_cov_result="${CONFIG_COV_RESULT:-skipped}"
          state="success"
          description="All checks passed"

          # Check Python CI
          case "$python_result" in
            success)
              ;;
            failure)
              state="failure"
              description="Python CI failed"
              ;;
            cancelled)
              state="error"
              description="Python CI was cancelled"
              ;;
            skipped)
              ;;
            *)
              state="pending"
              description="Python CI status unknown"
              ;;
          esac

          # Check LLM dependency validation
          if [ "$state" = "success" ]; then
            case "$llm_deps_result" in
              success)
                ;;
              failure)
                state="failure"
                description="LLM dependency compatibility check failed"
                ;;
              cancelled)
                state="error"
                description="LLM dependency compatibility check was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="LLM dependency compatibility status unknown"
                ;;
            esac
          fi

          # Check final supported-surface contracts.
          if [ "$state" = "success" ]; then
            case "$legacy_surface_result" in
              success)
                ;;
              failure)
                state="failure"
                description="Legacy surface contract failed"
                ;;
              cancelled)
                state="error"
                description="Legacy surface contract was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="Legacy surface contract status unknown"
                ;;
            esac
          fi

          # Check Config Coverage
          if [ "$state" = "success" ]; then
            case "$config_cov_result" in
              success)
                description="Python CI passed"
                ;;
              failure)
                state="failure"
                description="Config coverage check failed"
                ;;
              cancelled)
                state="error"
                description="Config coverage was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="Config coverage status unknown"
                ;;
            esac
          fi

          detect_result="${DETECT_RESULT:-skipped}"
          if [[ "${detect_result}" != "success" ]]; then
            if [[ "${detect_result}" == "failure" ]]; then
              state="failure"
              description="Path classification failed"
            elif [[ "${detect_result}" == "cancelled" ]]; then
              state="error"
              description="Path classification was cancelled"
            else
              state="pending"
              description="Path classification status unknown"
            fi
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "[Gate] State: ${state}, Description: ${description}"

      # Note: We use GITHUB_TOKEN directly for commit status creation.
      # This is just one API call per CI run, so it doesn't contribute significantly to rate limits.
      # Using App token would require statuses:write permission which may not be configured.

      - name: Report Gate commit status
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ steps.summarize.outputs.state || 'pending' }}
          DESCRIPTION: ${{ steps.summarize.outputs.description || 'Gate status pending' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # Use GITHUB_TOKEN directly - commit status is one call per run, not rate limit sensitive
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const rawState = process.env.STATE || 'pending';
            const allowed = new Set(['error', 'failure', 'pending', 'success']);
            const state = allowed.has(rawState) ? rawState : 'pending';
            const rawDescription = process.env.DESCRIPTION || 'Gate status update';
            const description =
              rawDescription.length > 140
                ? `${rawDescription.slice(0, 137)}...`
                : rawDescription;
            const targetUrl = process.env.TARGET_URL;

            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: 'Gate / gate',
                description,
                target_url: targetUrl,
              });
              console.log(`Created commit status: ${state} - ${description}`);
            } catch (error) {
              const isRateLimitError =
                error?.status === 403 &&
                /rate limit/i.test(error?.message || '');
              if (isRateLimitError) {
                core.warning('Rate limit prevented Gate from updating the commit status.');
              } else {
                throw error;
              }
            }

      - name: Enforce Gate success
        if: ${{ steps.summarize.outputs.state == 'failure' }}
        run: |
          echo "Gate reported failure: ${{ steps.summarize.outputs.description }}" >&2
          exit 1
