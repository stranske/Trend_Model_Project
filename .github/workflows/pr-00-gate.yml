# -----------------------------------------------------------------------------
# Gate Workflow — Consumer Repository Template
# -----------------------------------------------------------------------------
# Orchestrates CI enforcement for pull requests. The `summary` job aggregates
# results and publishes the commit status that keepalive automation relies on.
#
# USAGE:
#   - Standard Python projects: Use this template as-is
#   - Custom projects: Use as a STARTING POINT, customize the test job(s)
#
# IMPORTANT: The `summary` job and `Gate / gate` commit status are REQUIRED
# for keepalive automation to detect CI results. Do not remove or rename them.
#
# SYNC BEHAVIOR:
#   - This file is NOT auto-synced to repos with custom Gate workflows
#   - Repos in CUSTOM_GATE_REPOS list in maint-68-sync-consumer-repos.yml
#     maintain their own Gate and should update manually if needed
#
# Copy this file to: .github/workflows/pr-00-gate.yml
#
# Required secrets: None (uses GITHUB_TOKEN)
# Optional secrets: Passed via `secrets: inherit` to reusable workflow
#
# Examples of custom Gates based on this template:
#   - stranske/trip-planner (Flask + requirements.txt)
#   - stranske/Manager-Database (FastAPI + docker-compose)
# -----------------------------------------------------------------------------

name: Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref_name }}-gate
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: resolve Gate PR context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_request: ${{ steps.resolve.outputs.pull_request }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: resolve
        env:
          PR_NUMBER: ''
        with:
          script: |
            let pr = context.payload.pull_request || null;
            const dispatchedPr = context.eventName === 'workflow_dispatch' && process.env.PR_NUMBER;
            if (pr || dispatchedPr) {
              const number = dispatchedPr ? Number(process.env.PR_NUMBER) : pr.number;
              if (!Number.isSafeInteger(number) || number <= 0
                  || (dispatchedPr && String(number) !== process.env.PR_NUMBER)) {
                throw new Error('pr_number must be a positive integer');
              }
              const { data } = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (dispatchedPr) {
                if (data.state !== 'open' || data.head.repo.full_name !== process.env.GITHUB_REPOSITORY
                    || data.head.sha !== context.sha) {
                  throw new Error('Dispatch must target the current open same-repository PR head');
                }
              } else if (data.state !== 'open' || data.number !== pr.number
                  || data.head?.sha !== pr.head?.sha
                  || data.head?.repo?.full_name !== pr.head?.repo?.full_name
                  || data.head?.ref !== pr.head?.ref || data.base?.ref !== pr.base?.ref) {
                throw new Error('PR identity changed before Gate metadata refresh');
              }
              // A rerun keeps the original event body. Refresh mutable metadata
              // only after preserving the immutable PR/head/repository binding.
              pr = dispatchedPr ? data : { ...pr, title: data.title, body: data.body, labels: data.labels,
                state: data.state };
            }
            core.setOutput('pull_request', JSON.stringify(pr));

  detect:
    needs: ["resolve-pr"]
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      is_python_code: ${{ steps.classify.outputs.is-python-code || 'true' }}
      is_workflow_change: ${{ steps.classify.outputs.is-workflow-change || 'false' }}
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      classification_rationale: ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    env:
      GATE_PR_JSON: ${{ needs.resolve-pr.outputs.pull_request }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        uses: stranske/Workflows/.github/actions/path-classifier@40e80e510f61e81f5612064b035a77e9b8d28756
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify:full') || github.event_name == 'schedule' }}

  generated-delivery-seal:
    name: generated delivery seal
    needs: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an exact-head delivery seal
        uses: stranske/Workflows/.github/actions/generated-delivery-seal@fe1efdada4ece0e9668db83ae3867e74c29c7744
        with:
          pull-request-json: ${{ needs.resolve-pr.outputs.pull_request }}

  python-ci:
    name: Python CI
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    uses: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main
    with:
      python-versions: '["3.12", "3.13"]'
      coverage-min: "80"
      # Must stay true: ci.yml enforces `black --check --line-length 100` on push to main,
      # so a PR gate that skips the format check lets unformatted code merge green and redden
      # the default branch on the very next push. The old comment here ("Using ruff for
      # formatting") was inaccurate - this repo does not run `ruff format`, and its ruff config
      # is lint.select = ["E4","E7","E9","F"], which performs no formatting at all.
      format_check: true
      working-directory: "."
      artifact-prefix: "gate-"
      # Keep PR Gate fast: the MC-viz CLI integration suite runs in a dedicated
      # workflow triggered by relevant file changes.
      pytest_markers: "not mc_viz_integration"
      # Enable soft coverage gate for trend tracking and hotspot reporting
      enable-soft-gate: true
    secrets: inherit

  llm-deps:
    name: LLM Dependency Compatibility
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies (LLM + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Validate LLM dependency compatibility
        run: |
          python scripts/validate_llm_deps.py
          pytest -q tests/test_llm_dependency_compatibility.py

  legacy-surface:
    name: Legacy Surface Contract
    needs: detect
    # The scanner covers workflows, scripts, root launchers, and active docs in
    # addition to Python. Run whenever path classification completes, succeeds,
    # fails, or is skipped so none of those surfaces bypass the contract through
    # a category gap. `!cancelled()` keeps the contract enforced when
    # classification fails, because a skipped job is not reported as a failed
    # check to branch protection.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Verify final supported surface
        run: |
          pytest -q \
            tests/test_legacy_surface_absence.py \
            tests/test_wheel_surface.py \
            tests/test_cli_installed.py \
            tests/test_streamlit_smoke_ci.py \
            tests/test_export_outputs.py \
            tests/test_config_schema.py::test_validate_core_config_round_trips \
            tests/test_trend_cli_entrypoints.py::test_main_check_flag_without_subcommand \
            tests/test_trend_cli_entrypoints.py::test_main_run_command \
            tests/test_trend_cli_entrypoints.py::test_main_report_command \
            tests/test_trend_cli_entrypoints.py::test_main_app_command_uses_extracted_handler \
            tests/test_trend_cli_quick_report.py::test_trend_quick_report_subcommand_creates_report \
            tests/test_cli_mc.py::test_mc_list_registry_and_tags \
            tests/test_cli_mc.py::test_mc_validate_success \
            tests/test_cli_mc.py::test_trend_mc_run_dispatches_scenario \
            tests/test_cli_mc.py::test_mc_viz_routes_selected_charts_and_exports_requested_formats \
            tests/golden/test_demo.py::TestDemoGoldenMaster::test_demo_pipeline_end_to_end

  config-coverage:
    name: Config Coverage Check
    needs: detect
    if: ${{ needs.detect.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run config coverage check
        run: |
          # "Ignored keys" here counts config keys READ during the demo run
          # (validated-key tracking is not yet wired, so ignored == read count).
          # Raised 72 -> 81: the config-loader fix (PortfolioSettings extra="allow")
          # makes the demo honor selection_mode/rank/selector/custom_weights/weighting,
          # and fleet-record fingerprinting now reads run metadata from the same config path.
          # Lowered 81 -> 76: A2 (#5400) deleted the ~19 documented-but-unconsumed keys,
          # reducing the ignored count from ~81 to 76.
          # Raised 76 -> 83: #5821 shared trend_spec_from_mapping reads legacy
          # signals.trend_* alias keys during the demo coverage run.
          # Raised 83 -> 85: #5813 api.run_simulation now resolves portfolio costs and
          # weighting through the shared config_contract helpers during demo runs.
          # Raised 85 -> 86: #5976 legacy gate strengthening migrates output→export in
          # the GUI path, causing run_simulation to read one additional config key.
          # Approved repo-specific divergence per create-only gate policy.
          python scripts/check_config_coverage.py \
            --config config/demo.yml \
            --ignored-threshold 86

  summary:
    name: gate-summary
    needs: ["detect", "python-ci", "llm-deps", "legacy-surface", "config-coverage", "generated-delivery-seal"]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      state: ${{ steps.summarize.outputs.state }}
      description: ${{ steps.summarize.outputs.description }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Summarize results
        id: summarize
        env:
          DELIVERY_SEAL_RESULT: ${{ needs.generated-delivery-seal.result || 'skipped' }}
          DETECT_RESULT: ${{ needs.detect.result || 'skipped' }}
          PYTHON_RESULT: ${{ needs.python-ci.result || 'skipped' }}
          LLM_DEPS_RESULT: ${{ needs.llm-deps.result || 'skipped' }}
          LEGACY_SURFACE_RESULT: ${{ needs.legacy-surface.result || 'skipped' }}
          CONFIG_COV_RESULT: ${{ needs.config-coverage.result || 'skipped' }}
        run: |
          set -euo pipefail

          python_result="${PYTHON_RESULT:-skipped}"
          llm_deps_result="${LLM_DEPS_RESULT:-skipped}"
          legacy_surface_result="${LEGACY_SURFACE_RESULT:-skipped}"
          config_cov_result="${CONFIG_COV_RESULT:-skipped}"
          state="success"
          description="All checks passed"

          # Check Python CI
          case "$python_result" in
            success)
              ;;
            failure)
              state="failure"
              description="Python CI failed"
              ;;
            cancelled)
              state="error"
              description="Python CI was cancelled"
              ;;
            skipped)
              ;;
            *)
              state="pending"
              description="Python CI status unknown"
              ;;
          esac

          # Check LLM dependency validation
          if [ "$state" = "success" ]; then
            case "$llm_deps_result" in
              success)
                ;;
              failure)
                state="failure"
                description="LLM dependency compatibility check failed"
                ;;
              cancelled)
                state="error"
                description="LLM dependency compatibility check was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="LLM dependency compatibility status unknown"
                ;;
            esac
          fi

          # Check final supported-surface contracts.
          if [ "$state" = "success" ]; then
            case "$legacy_surface_result" in
              success)
                ;;
              failure)
                state="failure"
                description="Legacy surface contract failed"
                ;;
              cancelled)
                state="error"
                description="Legacy surface contract was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="Legacy surface contract status unknown"
                ;;
            esac
          fi

          # Check Config Coverage
          if [ "$state" = "success" ]; then
            case "$config_cov_result" in
              success)
                description="Python CI passed"
                ;;
              failure)
                state="failure"
                description="Config coverage check failed"
                ;;
              cancelled)
                state="error"
                description="Config coverage was cancelled"
                ;;
              skipped)
                ;;
              *)
                state="pending"
                description="Config coverage status unknown"
                ;;
            esac
          fi

          detect_result="${DETECT_RESULT:-skipped}"
          if [[ "${detect_result}" != "success" ]]; then
            if [[ "${detect_result}" == "failure" ]]; then
              state="failure"
              description="Path classification failed"
            elif [[ "${detect_result}" == "cancelled" ]]; then
              state="error"
              description="Path classification was cancelled"
            else
              state="pending"
              description="Path classification status unknown"
            fi
          fi

          # Expose the same seal precondition already enforced by the classifier.
          # Never turn an existing product failure into a weaker pending result.
          seal_result="${DELIVERY_SEAL_RESULT:-skipped}"
          if [[ "${seal_result}" != "success" && "${state}" != "failure" && "${state}" != "error" ]]; then
            if [[ "${seal_result}" == "failure" ]]; then
              state="failure"
            elif [[ "${seal_result}" == "cancelled" ]]; then
              state="error"
            else
              state="pending"
            fi
            description="Generated delivery seal did not succeed"
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "[Gate] State: ${state}, Description: ${description}"

      # Note: We use GITHUB_TOKEN directly for commit status creation.
      # This is just one API call per CI run, so it doesn't contribute significantly to rate limits.
      # Using App token would require statuses:write permission which may not be configured.

      - name: Report Gate commit status
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ steps.summarize.outputs.state || 'pending' }}
          DESCRIPTION: ${{ steps.summarize.outputs.description || 'Gate status pending' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # Use GITHUB_TOKEN directly - commit status is one call per run, not rate limit sensitive
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const rawState = process.env.STATE || 'pending';
            const allowed = new Set(['error', 'failure', 'pending', 'success']);
            const state = allowed.has(rawState) ? rawState : 'pending';
            const rawDescription = process.env.DESCRIPTION || 'Gate status update';
            const description =
              rawDescription.length > 140
                ? `${rawDescription.slice(0, 137)}...`
                : rawDescription;
            const targetUrl = process.env.TARGET_URL;

            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: 'Gate / gate',
                description,
                target_url: targetUrl,
              });
              console.log(`Created commit status: ${state} - ${description}`);
            } catch (error) {
              const isRateLimitError =
                error?.status === 403 &&
                /rate limit/i.test(error?.message || '');
              // Pull requests opened from forks receive a read-only token, so the
              // status write is refused even after Gate has computed its verdict.
              // Keep same-repository permission failures loud and preserve the
              // existing rate-limit path.
              const pullRequest = context.payload.pull_request;
              const headRepoObject = pullRequest?.head?.repo;
              const headRepo = headRepoObject?.full_name;
              const baseRepo = pullRequest?.base?.repo?.full_name;
              const isForkPullRequest = Boolean(
                baseRepo &&
                  (headRepoObject === null || (headRepo && headRepo !== baseRepo)),
              );
              const readOnlyForkToken =
                error?.status === 403 && isForkPullRequest && !isRateLimitError;
              if (isRateLimitError) {
                core.warning('Rate limit prevented Gate from updating the commit status.');
              } else if (readOnlyForkToken) {
                core.warning(
                  'Fork pull request from ' +
                    `${headRepo ?? pullRequest?.head?.label ?? 'deleted source repository'}: ` +
                    'the workflow token is ' +
                    "read-only, so the 'Gate / gate' commit status could not be " +
                    `written (${error.message}). Gate verdict for ${sha} is ` +
                    `'${state}': ${description}.`,
                );
                await core.summary
                  .addHeading('Gate verdict (fork pull request)', 3)
                  .addRaw(
                    'The `Gate / gate` commit status could not be written for ' +
                      `\`${sha}\` because a pull request from a fork receives a ` +
                      `read-only token. Gate verdict: **${state}** — ${description}`,
                  )
                  .write();
              } else {
                throw error;
              }
            }

      - name: Enforce Gate success
        if: ${{ steps.summarize.outputs.state == 'failure' }}
        run: |
          echo "Gate reported failure: ${{ steps.summarize.outputs.description }}" >&2
          exit 1
