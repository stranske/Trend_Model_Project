# Cost regime example scenario:
# - Demonstrates stochastic calm/stress switching for transaction costs.
# - Demonstrates regime-specific slippage multipliers.
# - Intended as a known-good reference for regression tests and CLI examples.
# - Run with: python -m trend_analysis.cli mc run --scenario cost_regime_example --dry-run --n-paths 10
# - Validate with: python -m pytest tests/monte_carlo/test_costs.py tests/monte_carlo/test_registry.py -q --no-cov
scenario:
  name: cost_regime_example
  description: "Example scenario exercising regime-switching costs and slippage."
  version: "1.0"

base_config: config/defaults.yml

# Keep risk-free fallback available for score-frame calculations, but do not
# rely on it to create CASH.  CASH injection is gated by metrics.rf_override_enabled.
data:
  allow_risk_free_fallback: true

metrics:
  rf_override_enabled: true
  rf_rate_annual: 0.03

monte_carlo:
  mode: two_layer
  n_paths: 20
  horizon_years: 2
  frequency: M
  seed: 20260211
  jobs: 1

costs:
  kind: regime_stochastic
  default_regime: calm
  # Canonical schema: regime blocks live directly under `costs`.
  # Use `costs.calm` / `costs.stress` (not `costs.regimes.calm`).
  calm:
    # Baseline all-in trading cost in basis points (bps) in normal markets.
    trade_cost_bps:
      kind: lognormal
      mean: 5
      sigma: 0.20
    # Multiplies modeled slippage under calm liquidity conditions.
    slippage_multiplier: 1.0
  stress:
    # Elevated all-in trading cost in basis points (bps) during stress regimes.
    trade_cost_bps:
      kind: lognormal
      mean: 20
      sigma: 0.35
    # Multiplies modeled slippage when liquidity worsens in stress.
    slippage_multiplier: 1.8

strategy_set:
  curated_pack: strategies/hf_equity_curated.yml

outputs:
  directory: outputs/monte_carlo/{scenario_name}/{timestamp}
  formats: [csv]
