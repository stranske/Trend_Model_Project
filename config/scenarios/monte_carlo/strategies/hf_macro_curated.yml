# yaml-language-server: $schema=../../../../schemas/strategy_pack.schema.json
# Strategy Pack: HF Macro Curated
# Description: Curated strategy variants for macro Monte Carlo scenarios.

curated:
  - name: Rank_8_Equal_TightTurnover
    tags: [macro, hf, rank, concentrated, equal_weight, tight_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_n
          n: 8
          score_by: sharpe_ratio
          transform: raw
        weighting_scheme: equal
        max_turnover: 0.08
        constraints:
          max_weight: 0.22
          max_active_positions: 8

  - name: TopPct_25_RiskParity_ModerateTurnover
    tags: [macro, hf, rank, top_pct, risk_parity, moderate_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_pct
          pct: 0.25
          score_by: information_ratio
          transform: raw
        weighting_scheme: risk_parity
        max_turnover: 0.16
        constraints:
          max_weight: 0.15

  - name: Threshold_ZScore_HRP_Bayes_ModerateTurnover
    tags: [macro, hf, threshold, hrp, bayes, moderate_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: threshold
          threshold: 0.70
          score_by: sharpe_ratio
          transform: zscore
        weighting_scheme: custom
        weighting:
          name: score_prop_bayes
          params:
            shrink_tau: 0.30
            column: Sharpe
        max_turnover: 0.15
        constraints:
          max_active_positions: 14

  - name: Rank_16_HRP_LooseTurnover
    tags: [macro, hf, rank, diversified, hrp, loose_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_n
          n: 16
          score_by: annual_return
          transform: raw
        weighting_scheme: hrp
        max_turnover: 0.24
        constraints:
          max_weight: 0.14
          max_active_positions: 16

  - name: Rank_20_ERC_LooseTurnover
    tags: [macro, hf, rank, diversified, erc, loose_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_n
          n: 20
          score_by: annual_return
          transform: raw
        weighting_scheme: erc
        max_turnover: 0.30
        constraints:
          max_weight: 0.10
          max_active_positions: 20

  - name: Rank_14_RobustMV_TightTurnover
    tags: [macro, hf, rank, robust_mv, tight_turnover, long_short]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_n
          n: 14
          score_by: information_ratio
          transform: raw
        weighting_scheme: robust_mv
        max_turnover: 0.10
        leverage_cap: 1.6
        constraints:
          long_only: false
          max_weight: 0.12

  - name: Rank_12_RobustRiskParity_ModerateTurnover
    tags: [macro, hf, rank, robust_risk_parity, moderate_turnover]
    overrides:
      portfolio:
        selection_mode: rank
        rank:
          inclusion_approach: top_n
          n: 12
          score_by: sharpe_ratio
          transform: raw
        weighting_scheme: robust_risk_parity
        max_turnover: 0.20
        constraints:
          max_weight: 0.15

  - name: Random_12_Equal_LooseTurnover
    tags: [macro, hf, random, stress_test, equal_weight, loose_turnover]
    overrides:
      portfolio:
        selection_mode: random
        random_n: 12
        weighting_scheme: equal
        max_turnover: 0.30
        constraints:
          max_weight: 0.12
          max_active_positions: 12
      vol_adjust:
        enabled: false

  - name: Manual_8_Equal_TightTurnover
    tags: [macro, hf, manual, concentrated, equal_weight, tight_turnover]
    overrides:
      portfolio:
        selection_mode: manual
        manual_list:
          - HF_MAC_Core_1
          - HF_MAC_Core_2
          - HF_MAC_Core_3
          - HF_MAC_Core_4
          - HF_MAC_Core_5
          - HF_MAC_Core_6
          - HF_MAC_Core_7
          - HF_MAC_Core_8
        weighting_scheme: equal
        max_turnover: 0.10
        constraints:
          max_weight: 0.22
          max_active_positions: 8

  - name: All_Equal_LowTurnover_LowVol
    tags: [macro, hf, all, equal_weight, low_turnover, low_vol]
    overrides:
      portfolio:
        selection_mode: all
        weighting_scheme: equal
        max_turnover: 0.05
        constraints:
          max_weight: 0.10
      vol_adjust:
        enabled: true
        target_vol: 0.08
