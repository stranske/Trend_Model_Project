# Minimal phase-3 configuration for one in-sample/out-of-sample evaluation.
version: "1"

data:
  csv_path: ../demo/demo_returns.csv
  date_column: Date
  frequency: ME
  risk_free_column: null
  allow_risk_free_fallback: true
  missing_policy: drop
  missing_limit: null

preprocessing:
  missing_data:
    policy: ffill
    limit: 2

vol_adjust:
  enabled: false
  target_vol: 0.10

sample_split:
  in_start: 2015-01
  in_end: 2022-12
  out_start: 2023-01
  out_end: 2024-12

portfolio:
  selection_mode: rank
  rank:
    inclusion_approach: top_n
    n: 5
    score_by: Sharpe
  selector:
    name: rank
    params:
      top_n: 5
      rank_column: Sharpe
  weighting:
    name: equal
    params: {}
  rebalance_calendar: NYSE
  cost_model:
    per_trade_bps: 0
    half_spread_bps: 0
  max_turnover: 1.0

benchmarks:
  spx: SPX

regime:
  enabled: true
  proxy: SPX
  model: binary_threshold
  method: rolling_return
  lookback: 24
  smoothing: 3
  threshold: 0.0
  neutral_band: 0.0015
  min_observations: 3
  annualise_volatility: true

metrics:
  registry:
    - annual_return
    - volatility
    - sharpe_ratio
    - sortino_ratio
    - information_ratio
    - max_drawdown

export:
  directory: demo/exports/single_period
  formats: [csv, xlsx, json, txt]

run:
  seed: 42
  jobs: 1
  checkpoint_dir: demo/checkpoints/single_period
