base_config: &base_config
  analysis:
    weighting:
      scheme: equal
    top_n: 8
    target_vol: 0.10
    frequency: "D"
    tags: []
  constraints:
    max_weight: 0.2

base_schema: &base_schema
  type: object
  properties:
    analysis:
      type: object
      properties:
        weighting:
          type: object
          properties:
            scheme:
              type: string
        top_n:
          type: integer
        target_vol:
          type: number
        frequency:
          type: string
        tags:
          type: array
          items:
            type: string
    constraints:
      type: object
      properties:
        max_weight:
          type: number

cases:
  - id: risk_parity_weighting
    instruction: "Use risk parity weighting."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.weighting.scheme
          value: risk_parity
      risk_flags: []
      summary: "Set weighting scheme to risk_parity."

  - id: select_top_12
    instruction: "Select top 12 funds."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.top_n
          value: 12
      risk_flags: []
      summary: "Set top_n to 12."

  - id: remove_position_limits
    instruction: "Remove position limits."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: remove
          path: constraints.max_weight
          value: null
      risk_flags:
        - REMOVES_CONSTRAINT
      summary: "Remove max_weight constraint."

  - id: target_vol_15
    instruction: "Target 15% volatility."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.target_vol
          value: 0.15
      risk_flags: []
      summary: "Set target_vol to 0.15."

  - id: monthly_and_risk_parity
    instruction: "Use monthly frequency and risk parity."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.frequency
          value: "M"
        - op: set
          path: analysis.weighting.scheme
          value: risk_parity
      risk_flags: []
      summary: "Set frequency to monthly and weighting to risk_parity."

  - id: unknown_key_request
    instruction: "Enable turbo mode."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Requested unknown key: turbo_mode."

  - id: conflicting_top_n
    instruction: "Set top_n to 5 and then set top_n to 12."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.top_n
          value: 12
      risk_flags: []
      summary: "Resolve conflict by setting top_n to 12."

  - id: ambiguous_request
    instruction: "Make the portfolio more conservative."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Need clarification on requested changes."

  - id: conflicting_frequency
    instruction: "Use monthly frequency and weekly frequency."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.frequency
          value: "M"
      risk_flags: []
      summary: "Chose monthly frequency."

  - id: typo_key
    instruction: "Set analysis.weighting.sheme to risk_parity."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Unknown key 'analysis.weighting.sheme'; did you mean 'analysis.weighting.scheme'?"

  - id: json_pointer_path
    instruction: "Use cap weighted scheme."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: /analysis/weighting/scheme
          value: cap_weighted
      risk_flags: []
      summary: "Set weighting scheme to cap_weighted."

  - id: code_fenced_response
    instruction: "Set top_n to 10."
    current_config: *base_config
    allowed_schema: *base_schema
    llm_response: |-
      ```json
      {"operations":[{"op":"set","path":"analysis.top_n","value":10}],"risk_flags":[],"summary":"Set top_n to 10."}
      ```
    expected_patch:
      operations:
        - op: set
          path: analysis.top_n
          value: 10
      risk_flags: []
      summary: "Set top_n to 10."

  - id: merge_constraints
    instruction: "Set max weight to 10% and add min weight 2%."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: merge
          path: constraints
          value:
            max_weight: 0.1
            min_weight: 0.02
      risk_flags:
        - BROAD_SCOPE
      summary: "Merge constraint updates for max_weight and min_weight."

  - id: append_tag
    instruction: "Tag this config as momentum."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: append
          path: analysis.tags
          value: momentum
      risk_flags: []
      summary: "Append tag 'momentum' to analysis.tags."

  - id: invalid_value_request
    instruction: "Set top_n to -5."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Rejected invalid top_n value; requested value is out of range."

  - id: retry_invalid_json_then_success
    instruction: "Set top_n to 9."
    current_config: *base_config
    allowed_schema: *base_schema
    retries: 1
    llm_responses:
      - not-json
      - '{"operations":[{"op":"set","path":"analysis.top_n","value":9}],"risk_flags":[],"summary":"Set top_n to 9."}'
    expected_log_count: 1
    expected_log_fragments:
      - "ConfigPatch parse attempt 1/2 failed"
    expected_patch:
      operations:
        - op: set
          path: analysis.top_n
          value: 9
      risk_flags: []
      summary: "Set top_n to 9."

  - id: retry_validation_error_then_success
    instruction: "Set target_vol to 0.12."
    current_config: *base_config
    allowed_schema: *base_schema
    retries: 1
    llm_responses:
      - '{"operations":[{"op":"set","path":"analysis.target_vol","value":0.12}],"risk_flags":[]}'
      - '{"operations":[{"op":"set","path":"analysis.target_vol","value":0.12}],"risk_flags":[],"summary":"Set target_vol to 0.12."}'
    expected_log_count: 1
    expected_log_fragments:
      - "ConfigPatch parse attempt 1/2 failed"
    expected_patch:
      operations:
        - op: set
          path: analysis.target_vol
          value: 0.12
      risk_flags: []
      summary: "Set target_vol to 0.12."

  - id: retry_invalid_path_then_success
    instruction: "Set top_n to 14."
    current_config: *base_config
    allowed_schema: *base_schema
    retries: 1
    llm_responses:
      - '{"operations":[{"op":"set","path":"analysis..top_n","value":14}],"risk_flags":[],"summary":"Set top_n to 14."}'
      - '{"operations":[{"op":"set","path":"analysis.top_n","value":14}],"risk_flags":[],"summary":"Set top_n to 14."}'
    expected_log_count: 1
    expected_log_fragments:
      - "ConfigPatch parse attempt 1/2 failed"
    expected_patch:
      operations:
        - op: set
          path: analysis.top_n
          value: 14
      risk_flags: []
      summary: "Set top_n to 14."

  - id: retry_exhausted_invalid_json
    instruction: "Set frequency to weekly."
    current_config: *base_config
    allowed_schema: *base_schema
    retries: 1
    llm_responses:
      - "{bad-json"
      - "{still-bad-json"
    expected_error_contains: "Failed to parse ConfigPatch after 2 attempts"
    expected_log_count: 2
    expected_log_fragments:
      - "ConfigPatch parse attempt 1/2 failed"
      - "ConfigPatch parse attempt 2/2 failed"

  - id: retry_exhausted_validation_error
    instruction: "Use monthly frequency."
    current_config: *base_config
    allowed_schema: *base_schema
    retries: 2
    llm_responses:
      - '{"operations":[{"op":"set","path":"analysis.frequency","value":"M"}],"risk_flags":[]}'
      - '{"operations":[{"op":"set","path":"analysis.frequency","value":"M"}],"risk_flags":[]}'
      - '{"operations":[{"op":"set","path":"analysis.frequency","value":"M"}],"risk_flags":[]}'
    expected_error_contains: "Failed to parse ConfigPatch after 3 attempts"
    expected_log_count: 3
    expected_log_fragments:
      - "ConfigPatch parse attempt 1/3 failed"
      - "ConfigPatch parse attempt 2/3 failed"
      - "ConfigPatch parse attempt 3/3 failed"

  - id: success_merge_analysis_settings
    instruction: "Set frequency to weekly and top_n to 6."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: merge
          path: analysis
          value:
            frequency: W
            top_n: 6
      risk_flags:
        - BROAD_SCOPE
      summary: "Merge frequency and top_n updates into analysis."

  - id: success_remove_constraint_json_pointer
    instruction: "Remove the max weight constraint."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: remove
          path: /constraints/max_weight
          value: null
      risk_flags: []
      summary: "Remove max_weight constraint."

  - id: success_set_with_rationale
    instruction: "Switch to cap weighted scheme."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: analysis.weighting.scheme
          value: cap_weighted
      risk_flags: []
      summary: "Set weighting scheme to cap_weighted."

  - id: success_append_two_tags
    instruction: "Tag with momentum and quality."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: append
          path: analysis.tags
          value: momentum
        - op: append
          path: analysis.tags
          value: quality
      risk_flags: []
      summary: "Append momentum and quality tags to analysis.tags."

  - id: success_set_frequency_json_pointer
    instruction: "Use monthly frequency."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: set
          path: /analysis/frequency
          value: "M"
      risk_flags: []
      summary: "Set frequency to monthly."

  - id: unknown_nested_key
    instruction: "Set analysis.weighting.style to defensive."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Requested unknown key: analysis.weighting.style."

  - id: unknown_constraint_key
    instruction: "Set constraints.max_exposure to 0.5."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Requested unknown key: constraints.max_exposure."

  - id: ambiguous_frequency_request
    instruction: "Use a faster frequency."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Need clarification on requested frequency change."

  - id: conflicting_constraint_instructions
    instruction: "Remove max weight but keep the max weight constraint."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations: []
      risk_flags: []
      summary: "Conflicting instructions about max_weight."

  - id: conflicting_set_remove
    instruction: "Set max weight to 0.1 and then remove the max weight constraint."
    current_config: *base_config
    allowed_schema: *base_schema
    expected_patch:
      operations:
        - op: remove
          path: constraints.max_weight
          value: null
      risk_flags:
        - REMOVES_CONSTRAINT
      summary: "Remove max_weight constraint after conflicting instruction."
